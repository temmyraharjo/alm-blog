name: Export Power Platform Solution

on:
  workflow_dispatch:
    inputs:
      solution_name:
        description: "Blog CI solution is used for demonstration purposes in the Power Platform DevOps blog series. Change this input to export a different solution. The solution must already exist in the target environment."
        required: true
        type: string
        default: "Blog_CI"

permissions:
  contents: write

jobs:
  export:
    name: Export ${{ inputs.solution_name }}
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.detect_changes.outputs.has_changes }}
    environment:
      name: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          persist-credentials: true

      - name: Install Power Platform CLI tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: WhoAmI validation
        uses: microsoft/powerplatform-actions/who-am-i@v1
        with:
          environment-url: ${{ secrets.PP_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_APP_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}

      - name: Export solution
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ secrets.PP_ENVIRONMENT_URL }}
          app-id: ${{ secrets.PP_APP_ID }}
          client-secret: ${{ secrets.PP_CLIENT_SECRET }}
          tenant-id: ${{ secrets.PP_TENANT_ID }}
          solution-name: ${{ inputs.solution_name }}
          solution-output-file: out/${{ inputs.solution_name }}_dev_${{ github.run_number }}_unmanaged.zip
          managed: false

      - name: Unpack solution to src/solutions/${{ inputs.solution_name }}
        shell: bash
        run: |
          mkdir -p "src/solutions/${{ inputs.solution_name }}"
          pac_cmd="pac"
          if ! command -v pac >/dev/null 2>&1; then
            if [ -x "${POWERPLATFORMTOOLS_PACPATH:-}" ]; then
              pac_cmd="${POWERPLATFORMTOOLS_PACPATH}"
            elif [ -x "${POWERPLATFORMTOOLS_PACPATH:-}/pac" ]; then
              pac_cmd="${POWERPLATFORMTOOLS_PACPATH}/pac"
            else
              echo "PAC CLI not found. POWERPLATFORMTOOLS_PACPATH='${POWERPLATFORMTOOLS_PACPATH:-}'"
              exit 1
            fi
          fi

          "$pac_cmd" solution unpack \
            --zipfile "out/${{ inputs.solution_name }}_dev_${{ github.run_number }}_unmanaged.zip" \
            --folder "src/solutions/${{ inputs.solution_name }}" \
            --packagetype Unmanaged

      - name: Copy unmanaged zip into src/solutions/${{ inputs.solution_name }}
        shell: bash
        run: |
          cp \
            "out/${{ inputs.solution_name }}_dev_${{ github.run_number }}_unmanaged.zip" \
            "src/solutions/${{ inputs.solution_name }}/${{ inputs.solution_name }}_unmanaged.zip"

      - name: Build review input bundle
        shell: bash
        run: |
          mkdir -p review
          if git ls-files --error-unmatch "src/solutions/${{ inputs.solution_name }}" >/dev/null 2>&1; then
            git diff -- "src/solutions/${{ inputs.solution_name }}" > review/changes.diff || true
          else
            git diff --no-index -- /dev/null "src/solutions/${{ inputs.solution_name }}" > review/changes.diff || true
          fi
          git status --porcelain --untracked-files=all -- "src/solutions/${{ inputs.solution_name }}" > review/changes.status || true
          cp "src/solutions/Rule.md" review/rules.md
          {
            echo "Review the unpacked Power Platform solution changes."
            echo
            echo "Target solution: ${{ inputs.solution_name }}"
            echo
            echo "You must read and apply the rules from rules.md."
            echo "Only evaluate custom tables and custom attributes in scope as defined in the rules."
            echo "Start with a human-readable summary in this exact style:"
            echo "- Added table <table logical name> - <table display name>"
            echo "  | Attribute | Display Name | Description |"
            echo "  | <attribute logical name> | <attribute display name> | <short data type/definition description> |"
            echo "Use Added/Updated/Deleted table wording based on actual diff evidence."
            echo "If a table has no attribute changes in scope, still include the table line and write 'No in-scope attribute changes'."
            echo "Start with a detailed CHANGE INVENTORY section (not generic summary)."
            echo "For each in-scope custom table, show: table logical name, action (Created/Modified/Deleted), and evidence from the diff."
            echo "Under each table, list all in-scope custom attributes touched by the diff and show: attribute logical name, action (Created/Modified/Deleted), type (Lookup/Other), and lookup target if lookup."
            echo "After the inventory, add a RULE EVALUATION section that maps each listed component to the full rule names from rules.md (no RULE-xxx IDs) with PASS/ERROR/WARNING as applicable."
            echo "Then list findings using the exact output structure defined in rules.md."
            echo "If a rule does not apply to a component, explicitly mark it as N/A."
            echo "If there are no findings, say so explicitly."
            echo "If there are no in-scope custom tables/attributes in the diff, state that explicitly in CHANGE INVENTORY."
          } > review/instructions.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate review summary
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_BASE_URL: ${{ vars.AZURE_OPENAI_BASE_URL }}
          AZURE_OPENAI_MODEL: ${{ vars.AZURE_OPENAI_MODEL }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib import request

          def write_fallback(message: str) -> None:
            Path('review/summary.md').write_text(message.strip() + '\n', encoding='utf-8')

          api_key = os.environ.get('AZURE_OPENAI_API_KEY', '').strip()
          base_url = os.environ.get('AZURE_OPENAI_BASE_URL', '').strip()
          model = os.environ.get('AZURE_OPENAI_MODEL', '').strip()

          if not api_key or not base_url or not model:
            write_fallback('''
          LLM review was skipped because Azure Foundry settings are incomplete.

          Required configuration:
          - secret: AZURE_OPENAI_API_KEY
          - variable: AZURE_OPENAI_BASE_URL
          - variable: AZURE_OPENAI_MODEL

          Review inputs were still generated:
          - review/rules.md
          - review/changes.diff
          - review/instructions.txt
          ''')
            raise SystemExit(0)

          instructions = Path('review/instructions.txt').read_text(encoding='utf-8')
          rules = Path('review/rules.md').read_text(encoding='utf-8')
          diff = Path('review/changes.diff').read_text(encoding='utf-8')
          status = Path('review/changes.status').read_text(encoding='utf-8') if Path('review/changes.status').exists() else ''

          # Build a conservative allow-list of logical-name-like tokens seen in the diff.
          # The model must not invent names outside this list.
          logical_name_pattern = re.compile(r'\b[a-z][a-z0-9]{1,15}_[a-z0-9_]{2,120}\b')
          allowed_components = sorted(set(logical_name_pattern.findall(diff)))
          allowed_components_text = '\n'.join(f'- {name}' for name in allowed_components)
          if not allowed_components_text:
            allowed_components_text = '- (none detected)'

          normalized_base_url = base_url.rstrip('/')
          if not normalized_base_url.endswith('/openai/v1'):
            write_fallback('AZURE_OPENAI_BASE_URL must end with /openai/v1 or /openai/v1/.')
            raise SystemExit(0)

          def call_model(system_text: str, user_text: str) -> str:
            payload = {
              'model': model,
              'input': [
                {
                  'role': 'system',
                  'content': [
                    {
                      'type': 'input_text',
                      'text': system_text
                    }
                  ]
                },
                {
                  'role': 'user',
                  'content': [
                    {
                      'type': 'input_text',
                      'text': user_text
                    }
                  ]
                }
              ]
            }

            req = request.Request(
              f'{normalized_base_url}/responses',
              data=json.dumps(payload).encode('utf-8'),
              headers={
                'api-key': api_key,
                'Content-Type': 'application/json'
              },
              method='POST'
            )

            with request.urlopen(req) as response:
              body = json.loads(response.read().decode('utf-8'))

            text_parts = []
            for item in body.get('output', []):
              for content in item.get('content', []):
                if content.get('type') == 'output_text':
                  text_parts.append(content.get('text', ''))
            return '\n'.join(part for part in text_parts if part).strip()

          def generate_rule_review(user_text: str) -> str:
            return call_model(
              (
                'You are reviewing unpacked Microsoft Power Platform solution changes. '
                'Follow the provided rules exactly and produce a detailed, evidence-based review. '
                'Never invent components. Only use component logical names that appear in the provided allow-list or are directly present in the diff. '
                'If no in-scope custom components exist, explicitly say so.'
              ),
              user_text,
            )

          def local_name(tag: str) -> str:
            return tag.split('}', 1)[-1].lower() if tag else ''

          def first_text(node: ET.Element, names: set[str]) -> str:
            for item in node.iter():
              if local_name(item.tag) in names:
                value = (item.text or '').strip()
                if value:
                  return value
            return ''

          def pretty_name(logical_name: str) -> str:
            short = logical_name.split('_', 1)[1] if '_' in logical_name else logical_name
            return short.replace('_', ' ').strip().title()

          def parse_status_paths(status_text: str) -> dict[str, list[str]]:
            buckets = {'added': [], 'modified': [], 'deleted': []}
            for line in status_text.splitlines():
              if not line.strip() or len(line) < 4:
                continue
              code = line[:2]
              path = line[3:].strip()
              if not path:
                continue
              if code == '??' or code.startswith('A'):
                buckets['added'].append(path)
              elif 'D' in code:
                buckets['deleted'].append(path)
              else:
                buckets['modified'].append(path)
            return buckets

          def parse_entity_xml(entity_xml_path: Path, table_logical: str) -> tuple[str, list[tuple[str, str, str]]]:
            table_display = pretty_name(table_logical)
            attributes: list[tuple[str, str, str]] = []

            try:
              root = ET.fromstring(entity_xml_path.read_text(encoding='utf-8', errors='ignore'))
            except Exception:
              return table_display, attributes

            display_from_xml = first_text(root, {'displayname'})
            if display_from_xml:
              table_display = display_from_xml

            prefix = table_logical.split('_', 1)[0] + '_' if '_' in table_logical else ''
            seen: set[str] = set()

            for node in root.iter():
              if local_name(node.tag) != 'attribute':
                continue
              logical = first_text(node, {'logicalname', 'name'})
              if not logical or logical in seen:
                continue
              seen.add(logical)

              # Only report custom attributes for this publisher prefix.
              if prefix and not logical.startswith(prefix):
                continue

              attr_display = first_text(node, {'displayname'}) or logical
              attr_type = first_text(node, {'attributetype', 'type'}) or 'Unknown'
              attributes.append((logical, attr_display, attr_type))

            attributes.sort(key=lambda item: item[0])
            return table_display, attributes

          def generate_human_change_summary_from_xml(status_text: str) -> str:
            paths = parse_status_paths(status_text)
            entity_file_pattern = re.compile(r'^src/solutions/[^/]+/Entities/([^/]+)/Entity\.xml$')

            added_tables: list[str] = []
            modified_tables: list[str] = []

            for p in paths['added']:
              if entity_file_pattern.match(p):
                added_tables.append(p)

            for p in paths['modified']:
              if entity_file_pattern.match(p):
                modified_tables.append(p)

            lines: list[str] = []
            lines.append('## XML-Based Change Summary')
            lines.append('')

            if not added_tables and not modified_tables:
              lines.append('No custom table Entity.xml additions/modifications were detected in this run.')
              return '\n'.join(lines)

            def append_table_section(title: str, table_paths: list[str]) -> None:
              lines.append(f'### {title}')
              lines.append('')
              if not table_paths:
                lines.append('- None')
                lines.append('')
                return

              for path_str in sorted(table_paths):
                match = entity_file_pattern.match(path_str)
                if not match:
                  continue
                table_logical = match.group(1)
                table_display, attrs = parse_entity_xml(Path(path_str), table_logical)

                if '_' not in table_logical:
                  continue

                lines.append(f'- {title[:-1]} table {table_display} ({table_logical})')
                if attrs:
                  lines.append('')
                  lines.append('| Attribute | Display Name | Data Type |')
                  lines.append('|---|---|---|')
                  for logical, display, dtype in attrs:
                    safe_display = display.replace('|', '\\|')
                    safe_dtype = dtype.replace('|', '\\|')
                    lines.append(f'| {logical} | {safe_display} | {safe_dtype} |')
                else:
                  lines.append('  - No custom attributes detected from Entity.xml.')
                lines.append('')

            append_table_section('Added Tables', added_tables)
            append_table_section('Modified Tables', modified_tables)

            if paths['deleted']:
              lines.append('### Deleted Files')
              lines.append('')
              for p in sorted(paths['deleted']):
                lines.append(f'- {p}')
              lines.append('')

            return '\n'.join(lines).strip()

          base_user_text = (
            instructions
            + '\n\n--- RULES ---\n' + rules
            + '\n\n--- ALLOWED COMPONENTS (FROM DIFF) ---\n' + allowed_components_text
            + '\n\nUse only names from ALLOWED COMPONENTS (FROM DIFF). If no allowed custom components are present, state no in-scope changes.'
            + '\n\n--- DIFF ---\n' + diff
          )

          try:
            summary = generate_rule_review(base_user_text)
          except Exception as exc:
            write_fallback(f'LLM review request failed: {exc}')
            raise SystemExit(0)

          def get_unknown_components(text: str) -> list[str]:
            found = set(logical_name_pattern.findall(text))
            if not found:
              return []
            allowed_set = set(allowed_components)
            return sorted(name for name in found if name not in allowed_set)

          unknown = get_unknown_components(summary)

          # Retry once with a strict correction prompt if hallucinated names are found.
          if unknown:
            correction_text = (
              base_user_text
              + '\n\nThe previous answer was invalid because it referenced components not found in the diff: '
              + ', '.join(unknown)
              + '. Regenerate the full answer using only allowed components. Do not include any other logical names.'
            )
            try:
              summary = generate_rule_review(correction_text)
            except Exception:
              pass
            unknown = get_unknown_components(summary)

          if unknown:
            summary = (
              'LLM review was blocked because the generated output referenced components not present in the diff.\n\n'
              + 'Unknown components: ' + ', '.join(unknown) + '\n\n'
              + 'Allowed components detected from diff:\n' + allowed_components_text + '\n\n'
              + 'No trusted rules summary was produced for this run. Please review the diff manually or rerun.'
            )

          if not summary:
            summary = 'No LLM summary was returned.'

          try:
            change_summary = generate_human_change_summary_from_xml(status)
          except Exception as exc:
            change_summary = f'XML-based change summary failed: {exc}'

          if not change_summary.strip():
            change_summary = 'No LLM change summary was returned.'

          Path('review/change-summary.md').write_text(change_summary.strip() + '\n', encoding='utf-8')
          Path('review/summary.md').write_text(summary + '\n', encoding='utf-8')
          PY

      - name: Publish review summary
        shell: bash
        run: |
          {
            echo "## LLM Change Summary (From Diff)"
            echo
            cat review/change-summary.md
            echo
            echo "## LLM Rule Review Summary"
            echo
            cat review/summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Detect solution changes
        id: detect_changes
        shell: bash
        run: |
          solution_path="src/solutions/${{ inputs.solution_name }}"
          status_output="$(git status --porcelain --untracked-files=all -- "$solution_path")"

          if [ -n "$status_output" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"

            added_or_untracked="$(printf '%s\n' "$status_output" | grep -E '^A |^\?\? ' || true)"
            modified="$(printf '%s\n' "$status_output" | grep -E '^ M|^M |^MM|^AM|^ T|^T ' || true)"
            deleted="$(printf '%s\n' "$status_output" | grep -E '^ D|^D ' || true)"

            added_count="$(printf '%s\n' "$added_or_untracked" | sed '/^$/d' | wc -l | tr -d ' ')"
            modified_count="$(printf '%s\n' "$modified" | sed '/^$/d' | wc -l | tr -d ' ')"
            deleted_count="$(printf '%s\n' "$deleted" | sed '/^$/d' | wc -l | tr -d ' ')"

            {
              echo "## Git Change Detection (Commit/Push Decision Only)"
              echo
              echo "This section is from git status and is not the rules-based table/attribute review summary."
              echo
              echo "Changes were detected under $solution_path."
              echo
              echo "### Change Counts"
              echo
              echo "- Added or untracked: $added_count"
              echo "- Modified: $modified_count"
              echo "- Deleted: $deleted_count"
              echo
              if [ -n "$added_or_untracked" ]; then
                echo "### Added or Untracked Files"
                echo
                echo '```'
                printf '%s\n' "$added_or_untracked"
                echo '```'
                echo
              fi
              if [ -n "$modified" ]; then
                echo "### Modified Files"
                echo
                echo '```'
                printf '%s\n' "$modified"
                echo '```'
                echo
              fi
              if [ -n "$deleted" ]; then
                echo "### Deleted Files"
                echo
                echo '```'
                printf '%s\n' "$deleted"
                echo '```'
                echo
              fi
              echo "### Raw Git Status"
              echo
              echo '```'
              printf '%s\n' "$status_output"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Git Change Detection (Commit/Push Decision Only)"
              echo
              echo "This section is from git status and is not the rules-based table/attribute review summary."
              echo
              echo "No changes were detected under $solution_path."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Automatic push status
        shell: bash
        run: |
          if [ "${{ steps.detect_changes.outputs.has_changes }}" = "true" ]; then
            echo "Changes detected. Automatic commit/push will run in the next job." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No changes detected, so there is nothing to commit/push." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload exported zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.solution_name }}-dev
          path: out/*.zip
          if-no-files-found: error

      - name: Upload unpacked solution folder
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.solution_name }}-dev-unpacked
          path: src/solutions/${{ inputs.solution_name }}
          if-no-files-found: error

      - name: Upload review bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.solution_name }}-dev-review
          path: review/**
          if-no-files-found: error

  push_changes:
    name: Commit and push changes
    runs-on: ubuntu-latest
    needs: export
    if: ${{ needs.export.outputs.has_changes == 'true' }}

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          persist-credentials: true

      - name: Download unpacked solution artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.solution_name }}-dev-unpacked
          path: src/solutions

      - name: Commit and push unmanaged zip + unpacked solution changes
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" != "branch" ]; then
            echo "This workflow can only push when triggered from a branch ref."
            exit 1
          fi

          branch="${GITHUB_REF_NAME}"
          if [ "$branch" = "main" ] || [ "$branch" = "master" ]; then
            echo "Refusing to auto-push to '$branch'. Run this workflow from a feature branch."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          solution_path="src/solutions/${{ inputs.solution_name }}"
          add_path=""

          if [ -d "$solution_path" ]; then
            add_path="$solution_path"
          elif [ -d "src/solutions/Entities" ] || [ -d "src/solutions/AppModules" ] || [ -d "src/solutions/Other" ]; then
            echo "Solution root folder '$solution_path' was not present in downloaded artifact."
            echo "Using 'src/solutions' as commit scope for this run."
            add_path="src/solutions"
          else
            echo "Expected solution content not found under src/solutions."
            echo "Downloaded artifact layout:"
            find src -maxdepth 4 -type d 2>/dev/null || true
            exit 1
          fi

          git add "$add_path"

          if git diff --cached --quiet; then
            echo "No solution changes detected to commit."
            exit 0
          fi

          git commit -m "chore(${{ inputs.solution_name }}): export unmanaged zip and unpacked solution (run ${{ github.run_number }})"
          git push origin "HEAD:${branch}"
